[package]
name = "foundryui"
version = "0.1.0"
description = "Desktop interface for Azure AI Foundry Local"
authors = ["angelobelchior"]
edition = "2024"

[lib]
name = "foundryui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
toml = "1"
tokio = { version = "1.54.1", features = ["process", "time", "sync", "rt-multi-thread", "macros", "io-util", "fs"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
semver = "1.0.28"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
sysinfo = "0.40.1"
tempfile = "3.27.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
futures-util = "0.3.34"
base64 = "0.22"
cpal = "0.18.2"
tauri-plugin-dialog = "2.8.4"
pdf-extract = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-av-foundation = "0.3.2"
objc2-foundation = "0.3.2"
